name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ matrix.name }} 安装包
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundle: nsis
            artifact: windows-installer
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            bundle: dmg
            artifact: macos-installer
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 恢复 Rust 构建缓存
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 ${{ matrix.bundle }} 安装包
        run: npm run build -- --bundles ${{ matrix.bundle }}

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 下载安装包
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '*-installer'
          merge-multiple: true

      - name: 生成 Release 信息
        id: release
        run: |
          version=$(node -p "const [major, minor, patch] = require('./package.json').version.split('.'); [major, minor, Number(patch) + 1].join('.')")
          echo "tag=v${version}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=Web Profile v${version} (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
