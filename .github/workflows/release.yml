name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备发布版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 生成唯一版本号
        id: version
        shell: bash
        run: |
          version=$(node -p "const [major, minor, patch] = require('./package.json').version.split('.').map(Number); [major, minor, patch + Number(process.env.GITHUB_RUN_NUMBER)].join('.')")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.name }} 安装包
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundle: nsis
            update-platform: windows-x86_64
            artifact: windows-installer
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.sig
              update-platform.txt
          - name: macOS
            os: macos-latest
            bundle: app,dmg
            update-platform: darwin-aarch64
            artifact: macos-installer
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
              update-platform.txt
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 恢复 Rust 构建缓存
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: 安装前端依赖
        run: npm ci

      - name: 清理旧安装包产物
        shell: bash
        run: |
          rm -rf src-tauri/target/release/bundle/nsis
          rm -rf src-tauri/target/release/bundle/msi
          rm -rf src-tauri/target/release/bundle/macos
          rm -rf src-tauri/target/release/bundle/dmg

      - name: 构建 ${{ matrix.bundle }} 安装包
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run build -- --bundles ${{ matrix.bundle }}

      - name: 写入更新平台标识
        shell: bash
        run: echo '${{ matrix.update-platform }}' > update-platform.txt

      - name: 校验更新签名产物
        shell: bash
        run: |
          if [[ '${{ runner.os }}' == 'Windows' ]]; then
            compgen -G 'src-tauri/target/release/bundle/nsis/*.exe.sig' > /dev/null
          else
            compgen -G 'src-tauri/target/release/bundle/macos/*.app.tar.gz.sig' > /dev/null
          fi

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: 创建 GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 下载安装包
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '*-installer'

      - name: 生成更新清单
        run: >-
          node scripts/generate-update-manifest.mjs
          release-assets
          '${{ needs.prepare.outputs.version }}'
          '${{ github.repository }}'
          '${{ needs.prepare.outputs.tag }}'

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Web Profile v${{ needs.prepare.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.sig
            release-assets/**/*.dmg
            release-assets/**/*.tar.gz
            release-assets/latest.json
